name: Generate dashboard previews

on:
  push:
    paths:
      - 'index.html'
      - 'dashboard_brand/preview_manifest.json'
      - 'dashboard_brand/generate_previews.py'
      - 'dashboard_versions/version_notes.json'
      - 'dashboard_versions/sync_dashboard_versions.py'
      - 'dashboard_versions/*/index.html'
      - 'dashboard.versions.json'
      - '.github/workflows/generate-dashboard-previews.yml'
  workflow_dispatch:

jobs:
  generate-previews:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate SVG previews
        run: python dashboard_brand/generate_previews.py
      - name: Sync dashboard version history
        run: python dashboard_versions/sync_dashboard_versions.py
      - name: Commit generated previews
        run: |
          if git diff --quiet; then
            echo "No preview changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard_brand/previews dashboard.versions.json
          git commit -m "chore: refresh dashboard preview assets"
          git push
