<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brand Theme Starter</title>
  <link rel="stylesheet" href="./theme.css" />
  <link rel="stylesheet" href="./components.css" />
</head>
<body class="brand-app">
  <main class="brand-shell">
    <section class="brand-panel" style="padding:32px;">
      <div class="brand-eyebrow">Starter shell</div>
      <h1 class="brand-title">Use the dashboard theme in a new app.</h1>
      <p class="brand-copy">
        Copy this shell into a new app, then bring over the button, chip, panel, and card classes from
        the theme files. This keeps new projects visually aligned with the repository dashboard.
      </p>
      <div class="brand-actions">
        <a class="brand-button" href="#">Primary action</a>
        <a class="brand-button-secondary" href="#">Secondary action</a>
      </div>
    </section>
  </main>
</body>
</html>
